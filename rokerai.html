    let currentMessage = "";

    function getMood(text) {
      const emojis = text.match(/[\p{Emoji_Presentation}\p{Extended_Pictographic}]/gu) || [];
      if (emojis.length === 0) return { mood: "no_emoji", emojis: [], count: 0 };

      let scores = {};
      emojis.forEach(e => {
        for (const [mood, group] of Object.entries(moodMap)) {
          if (group.includes(e)) scores[mood] = (scores[mood] || 0) + 1;
        }
      });

      let top = "calm", max = 0;
      for (const [m, c] of Object.entries(scores)) {
        if (c > max) { max = c; top = m; }
      }
      return { mood: top, count: max, emojis: [...new Set(emojis)] };
    }

    function detectMood() {
      const result = getMood(document.getElementById('input').value);
      const big = result.emojis.slice(0, 15).join("") || "🌌";
      const msg = responses[result.mood] || "Your mood is out of this world!";

      currentMessage = msg.replace(/[\u{1F300}-\u{1F9FF}\u{2600}-\u{26FF}\u{2700}-\u{27BF}]/gu, '').trim();

        <div class="emoji-big">${big}</div><br>
        ${msg}<br><br>
        <small style="color:#00ffff"><b>${result.mood.toUpperCase()}</b> • ${result.count} emoji(s)</small>

    }

    function speakResult() {
      if ('speechSynthesis' in window) {
        speechSynthesis.cancel();
        const utter = new SpeechSynthesisUtterance(currentMessage || "No mood detected yet.");

        utter.lang = 'en-US';

      }
